# ========== Server ==========
server.port=${PORT:8080}

# ========== Database (uses env vars for Render/Postgres) ==========
spring.datasource.url=${DB_URL:jdbc:h2:mem:shophub;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# H2 console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ========== JWT ==========
jwt.secret=${JWT_SECRET:ShopHubSuperSecretKeyForJWT256BitsMinimumLength1234567890}
jwt.expiration=86400000

# ========== Actuator ==========
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.mail.enabled=false

# ========== Mail (SMTP - set MAIL_USERNAME/MAIL_PASSWORD app password in prod) ==========
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
shophub.mail.from=${MAIL_FROM:no-reply@shophub.com}
shophub.mail.enabled=${MAIL_ENABLED:false}
