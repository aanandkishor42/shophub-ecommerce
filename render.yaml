# Render blueprint - deploy backend web service + Postgres in one click
# Login to render.com -> New -> Blueprint -> select this repo

services:
  - type: web
    name: shophub-api
    runtime: docker
    repo: https://github.com/aanandkishor42/shophub-ecommerce
    plan: free
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DB_URL
        fromDatabase:
          name: shophub-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: shophub-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: shophub-db
          property: password
      - key: DB_DRIVER
        value: org.postgresql.Driver
      - key: PORT
        value: 8080
    healthCheckPath: /actuator/health
    autoDeploy: true

databases:
  - name: shophub-db
    plan: free